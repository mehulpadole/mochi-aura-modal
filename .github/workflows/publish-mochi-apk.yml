name: Publish MoCHi APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mochi-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download staged APK
        env:
          APK_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-aea4-8208-b74c-bc2aae357fdf/raw?se=2026-10-27T21%3A57%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=46b39696-2f4a-5e7a-b3ce-a63edb3501c4&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T11%3A59%3A53Z&ske=2026-10-28T11%3A59%3A53Z&sks=b&skv=2026-02-06&sig=83%2BWHZpbDjmcYCVmTTnXDfwULJTI0GSxxJaODDdlkD8%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o MoCHi.apk
          test "$(stat -c%s MoCHi.apk)" -eq 101933326
          echo "35ef051403c9c97ac1735c357018d093c3cf97ab4459ec55202456c0bed7e884  MoCHi.apk" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mochi-android-preview-2026-10-23
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" MoCHi.apk --repo "$GITHUB_REPOSITORY" --title "MoCHi Android Preview" --notes "Android preview build updated 28 October 2026. SHA-256: 35ef051403c9c97ac1735c357018d093c3cf97ab4459ec55202456c0bed7e884"
