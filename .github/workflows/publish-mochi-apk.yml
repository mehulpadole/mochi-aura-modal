name: Publish MoCHi APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mochi-apk.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download staged APK
        env:
          APK_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-1390-8208-bad5-e45c3838fd12/raw?se=2026-10-22T22%3A04%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=1ec84688-b701-5227-8dc5-9925bcc50c5f&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T07%3A29%3A09Z&ske=2026-10-23T07%3A29%3A09Z&sks=b&skv=2026-02-06&sig=Cb20K4r8jpEgb%2BTraIbq5EIWeJfuOB%2Bw6xJZQTzdZ9k%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o MoCHi.apk
          test "$(stat -c%s MoCHi.apk)" -eq 95620776
          echo "58fa91d6545067ace79ee9f424f11df960de6e8f88a760dace1e32f11bcebae6  MoCHi.apk" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mochi-android-preview-2026-10-23
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" MoCHi.apk             --repo "$GITHUB_REPOSITORY"             --title "MoCHi Android Preview"             --notes "Android preview build for direct testing. SHA-256: 58fa91d6545067ace79ee9f424f11df960de6e8f88a760dace1e32f11bcebae6"
